name: compliance-gate

on:
  push:
    branches: [master]
    paths:
      - '.claude/skills/**'
      - '.github/workflows/compliance-gate.yml'
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.github/workflows/compliance-gate.yml'

jobs:
  self-test:
    name: --self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: temurin:17

      - name: Warm the gate compile cache
        run: |
          scala-cli compile \
            .claude/skills/compliance-gate/project.scala \
            .claude/skills/compliance-gate/src/

      - name: Run --self-test
        run: ./.claude/skills/compliance-gate/bin/compliance-gate --self-test
